<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  <circle cx="256" cy="230" r="180" fill="url(#glow)" />
  
  <!-- Outer Glass Frame -->
  <rect x="70" y="70" width="372" height="372" rx="85" fill="#0f172a" fill-opacity="0.4" stroke="rgba(255,255,255,0.18)" stroke-width="3" />
  
  <!-- Mortarboard Cap -->
  <polygon points="256,120 410,185 256,250 102,185" fill="url(#gold)" />
  <polygon points="170,225 185,310 256,335 327,310 342,225 256,260" fill="#1e293b" stroke="#f59e0b" stroke-width="4" />
  <line x1="256" y1="240" x2="335" y2="310" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  
  <!-- Tassel -->
  <circle cx="256" cy="185" r="14" fill="#fef08a" />
  <path d="M256,185 Q330,210 375,260 L380,315" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <circle cx="380" cy="320" r="10" fill="#d97706" />
  
  <!-- Polyglot Constellation Nodes -->
  <circle cx="160" cy="380" r="15" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
  <circle cx="224" cy="405" r="15" fill="#4f46e5" stroke="#818cf8" stroke-width="3" />
  <circle cx="288" cy="405" r="15" fill="#d97706" stroke="#fbbf24" stroke-width="3" />
  <circle cx="352" cy="380" r="15" fill="#059669" stroke="#34d399" stroke-width="3" />
  <line x1="160" y1="380" x2="224" y2="405" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
  <line x1="224" y1="405" x2="288" y2="405" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
  <line x1="288" y1="405" x2="352" y2="380" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
</svg>