<text class="d-m" x="260.0" y="248.0" text-anchor="middle">→ 10.0.0.100</text>
<text class="d-s" x="260" y="280" text-anchor="middle">TTL 63</text>
<rect class="d-box" x="354" y="84" width="160" height="206" rx="10"/>
