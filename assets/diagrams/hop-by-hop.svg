<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 352" preserveAspectRatio="xMidYMid meet"><defs><marker id="m-hop-by-hop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-ah" d="M0 1.5 L9 5 L0 8.5z"/></marker><marker id="ms-hop-by-hop" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-ah" d="M0 1.5 L9 5 L0 8.5z"/></marker></defs>
<rect class="d-box" x="6" y="10" width="100" height="54" rx="10"/>
