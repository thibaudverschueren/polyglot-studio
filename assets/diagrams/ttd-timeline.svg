<rect class="d-box d-warn" x="82.8" y="32" width="377.1" height="30" rx="4"/>
<text class="d-l" x="51.425" y="52" text-anchor="middle">TTFT</text>
<text class="d-s" x="271.4" y="52" text-anchor="middle">150 tokens × 20 ms = 3 000 ms</text>
<text class="d-s d-bad-t" x="20" y="84" text-anchor="start">TTD = TTFT + N<tspan dy="0.32em" font-size="0.78em">out</tspan><tspan dy="-0.32em">&#8203;</tspan> × TPOT = 500 + 150 × 20 = 3 500 ms</text>
<text class="d-t" x="20" y="130" text-anchor="start">Beslissingsmodel (non-autoregressief)</text>
<rect class="d-box d-good" x="20" y="140" width="5" height="30" rx="2"/>
<text class="d-s d-good-t" x="34" y="156" text-anchor="start">één forward pass, geen output-tokens</text>
<text class="d-l d-good-t" x="34" y="174" text-anchor="start">lokaal 15-25 ms · via cloud-API 50-150 ms</text>
<line class="d-grid" x1="20" y1="220" x2="459.95000000000005" y2="220"/>
<line class="d-grid" x1="20.0" y1="216" x2="20.0" y2="224"/>
