<line class="d-grid" x1="271.4" y1="216" x2="271.4" y2="224"/>
<text class="d-l" x="271.4" y="240" text-anchor="middle">2 000 ms</text>
<line class="d-grid" x1="397.1" y1="216" x2="397.1" y2="224"/>
