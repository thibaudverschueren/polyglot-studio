<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%" style="background:#0f1117;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif">
  <defs>
    <linearGradient id="g-forward" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="g-loss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="g-backward" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="g-optim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <filter id="f-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="44" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.02em">De PyTorch LLM Trainingscyclus: Autograd &amp; Backpropagation</text>
  <text x="40" y="68" fill="#94a3b8" font-size="13">Wat er exact in geheugen en GPU-registers gebeurt bij elke stap in Python</text>

  <!-- Step 1: Batch Loading -->
  <g transform="translate(40, 110)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="28" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">1. DataLoader Batch</text>
    <text x="90" y="52" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">input_ids: (B, T)</text>
    <text x="90" y="70" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">labels: (B, T)</text>
  </g>

  <line x1="220" y1="155" x2="265" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 2: Forward Pass -->
  <g transform="translate(270, 110)">
    <rect width="210" height="90" rx="10" fill="url(#g-forward)" filter="url(#f-shadow)" />
    <text x="105" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2. Forward Pass</text>
    <text x="105" y="52" fill="#bfdbfe" font-size="11" font-family="monospace" text-anchor="middle">outputs = model(input_ids)</text>
    <text x="105" y="72" fill="#e0f2fe" font-size="10.5" text-anchor="middle">Bouwt Autograd Graph op</text>
  </g>

  <line x1="480" y1="155" x2="525" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 3: Loss Function -->
  <g transform="translate(530, 110)">
    <rect width="210" height="90" rx="10" fill="url(#g-loss)" filter="url(#f-shadow)" />
    <text x="105" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3. Cross-Entropy Loss</text>
    <text x="105" y="52" fill="#fecaca" font-size="11" font-family="monospace" text-anchor="middle">loss = loss_fn(logits, y)</text>
    <text x="105" y="72" fill="#fee2e2" font-size="10.5" text-anchor="middle">Scalar scalar value L ∈ R</text>
  </g>

  <!-- Downward arrow to backward -->
  <path d="M 635 200 L 635 270" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arr-back)" />
  <text x="645" y="240" fill="#c084fc" font-size="11" font-weight="600">Reverse Mode</text>

  <!-- Step 4: Backward Pass (Backprop) -->
  <g transform="translate(530, 275)">
    <rect width="210" height="95" rx="10" fill="url(#g-backward)" filter="url(#f-shadow)" />
    <text x="105" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">4. Backward Pass</text>
    <text x="105" y="52" fill="#e9d5ff" font-size="11" font-family="monospace" text-anchor="middle">loss.backward()</text>
    <text x="105" y="70" fill="#f3e8ff" font-size="10.5" text-anchor="middle">Kettingregel (Chain Rule)</text>
    <text x="105" y="85" fill="#f3e8ff" font-size="10.5" text-anchor="middle">Berekent param.grad: ∂L/∂W</text>
  </g>

  <line x1="530" y1="322" x2="485" y2="322" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-back)" />

  <!-- Step 5: Gradient Clipping & Optimizer Step -->
  <g transform="translate(260, 275)">
    <rect width="220" height="95" rx="10" fill="url(#g-optim)" filter="url(#f-shadow)" />
    <text x="110" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">5. Update &amp; Clip</text>
    <text x="110" y="48" fill="#a7f3d0" font-size="10.5" font-family="monospace" text-anchor="middle">clip_grad_norm_(params, 1.0)</text>
    <text x="110" y="66" fill="#d1fae5" font-size="11" font-family="monospace" text-anchor="middle">optimizer.step()</text>
    <text x="110" y="84" fill="#ecfdf5" font-size="10" text-anchor="middle">AdamW: W ← W - η·m̂ / (√v̂ + ε)</text>
  </g>

  <line x1="260" y1="322" x2="215" y2="322" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" />

  <!-- Step 6: Zero Grad & Next Iteration -->
  <g transform="translate(40, 275)">
    <rect width="170" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="85" y="28" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">6. Reset Gradients</text>
    <text x="85" y="52" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">optimizer.zero_grad()</text>
    <text x="85" y="74" fill="#94a3b8" font-size="10" text-anchor="middle">Wist geheugen in .grad</text>
  </g>

  <!-- Loopback arrow -->
  <path d="M 125 275 L 125 205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr)" />
  <text x="75" y="240" fill="#94a3b8" font-size="10" font-weight="600">Volgende batch</text>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 420)">
    <rect width="780" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" fill="#f8fafc" font-size="12" font-weight="700">Cruciaal Inzicht voor Geheugen (VRAM):</text>
    <text x="20" y="46" fill="#94a3b8" font-size="11.5">Tijdens training heb je per parameter nodig: Modelgewichten (16-bit = 2B) + Gradients (2B) + AdamW states (m &amp; v = 8B) = 16 bytes/param!</text>
  </g>
</svg>
