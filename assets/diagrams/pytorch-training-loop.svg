<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 538" preserveAspectRatio="xMidYMid meet"><defs><marker id="m-pytorch-training-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-ah" d="M0 1.5 L9 5 L0 8.5z"/></marker><marker id="ms-pytorch-training-loop" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-ah" d="M0 1.5 L9 5 L0 8.5z"/></marker></defs>
<rect class="d-box" x="65.0" y="8" width="330" height="51" rx="10"/>
<text class="d-t" x="230.0" y="30.5" text-anchor="middle">1 · Batch laden</text>
<text class="d-m" x="230.0" y="46.5" text-anchor="middle">input_ids, labels: (B, T)</text>
<path class="d-line" d="M230 59 L230 77" marker-end="url(#m-pytorch-training-loop)"/>
<rect class="d-box d-acc" x="65.0" y="77" width="330" height="67" rx="10"/>
<text class="d-t" x="230.0" y="99.5" text-anchor="middle">2 · Forward pass</text>
<text class="d-m" x="230.0" y="115.5" text-anchor="middle">logits = model(input_ids)</text>
<text class="d-s" x="230.0" y="131.5" text-anchor="middle">bouwt de autograd-graaf op</text>
<path class="d-line" d="M230 144 L230 162" marker-end="url(#m-pytorch-training-loop)"/>
<rect class="d-box d-warn" x="65.0" y="162" width="330" height="51" rx="10"/>
<text class="d-t" x="230.0" y="184.5" text-anchor="middle">3 · Cross-entropy loss</text>
<text class="d-m" x="230.0" y="200.5" text-anchor="middle">loss = cross_entropy(logits, y)</text>
<path class="d-line" d="M230 213 L230 231" marker-end="url(#m-pytorch-training-loop)"/>
<rect class="d-box d-info" x="65.0" y="231" width="330" height="67" rx="10"/>
<text class="d-t" x="230.0" y="253.5" text-anchor="middle">4 · Backward pass</text>
<text class="d-m" x="230.0" y="269.5" text-anchor="middle">loss.backward()</text>
<text class="d-s" x="230.0" y="285.5" text-anchor="middle">kettingregel: ∂L/∂W in param.grad</text>
<path class="d-line" d="M230 298 L230 316" marker-end="url(#m-pytorch-training-loop)"/>
<rect class="d-box d-good" x="65.0" y="316" width="330" height="67" rx="10"/>
<text class="d-t" x="230.0" y="338.5" text-anchor="middle">5 · Clippen en updaten</text>
<text class="d-m" x="230.0" y="354.5" text-anchor="middle">clip_grad_norm_(params, 1.0)</text>
<text class="d-m" x="230.0" y="370.5" text-anchor="middle">optimizer.step()   # AdamW</text>
<path class="d-line" d="M230 383 L230 401" marker-end="url(#m-pytorch-training-loop)"/>
<rect class="d-box" x="65.0" y="401" width="330" height="51" rx="10"/>
<text class="d-t" x="230.0" y="423.5" text-anchor="middle">6 · Gradiënten wissen</text>
<text class="d-m" x="230.0" y="439.5" text-anchor="middle">optimizer.zero_grad()</text>
<path class="d-line d-dash" d="M395.0 426.5 L431.0 426.5 L431.0 33.5 L397.0 33.5" marker-end="url(#m-pytorch-training-loop)"/>
<text class="d-l" x="439.0" y="187.5" text-anchor="start">volgende</text>
<text class="d-l" x="439.0" y="201.5" text-anchor="start">batch</text>
<rect class="d-box" x="20" y="466" width="480" height="62" rx="10"/>
<text class="d-t" x="260.0" y="494.0" text-anchor="middle">Geheugen per parameter bij AdamW + BF16</text>
<text class="d-s" x="260.0" y="510.0" text-anchor="middle">2 B gewicht + 2 B gradiënt + 4 B FP32-kopie + 8 B (m en v) = 16 B</text>
</svg>
