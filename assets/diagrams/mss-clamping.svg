<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 282" preserveAspectRatio="xMidYMid meet"><defs><marker id="m-mss-clamping" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-ah" d="M0 1.5 L9 5 L0 8.5z"/></marker><marker id="ms-mss-clamping" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-ah" d="M0 1.5 L9 5 L0 8.5z"/></marker></defs>
<rect class="d-box" x="10" y="8" width="120" height="50" rx="10"/>
<text class="d-t" x="70.0" y="30.5" text-anchor="middle">Client</text>
<text class="d-l" x="70.0" y="45.5" text-anchor="middle">MTU 1500</text>
<rect class="d-box d-info" x="185" y="8" width="150" height="50" rx="10"/>
<text class="d-t" x="260.0" y="30.5" text-anchor="middle">Router</text>
<text class="d-l" x="260.0" y="45.5" text-anchor="middle">tunnel MTU 1420</text>
<rect class="d-box" x="390" y="8" width="120" height="50" rx="10"/>
<text class="d-t" x="450.0" y="30.5" text-anchor="middle">Server</text>
<text class="d-l" x="450.0" y="45.5" text-anchor="middle">MTU 1500</text>
<line class="d-grid d-dash" x1="70" y1="60" x2="70" y2="232"/>
<line class="d-grid d-dash" x1="260" y1="60" x2="260" y2="232"/>
<line class="d-grid d-dash" x1="450" y1="60" x2="450" y2="232"/>
<path class="d-line" d="M72 96 L256 96" marker-end="url(#m-mss-clamping)"/>
<text class="d-l" x="164" y="84" text-anchor="middle">SYN · MSS = 1460</text>
<path class="d-line" d="M264 96 L446 96" marker-end="url(#m-mss-clamping)"/>
<text class="d-l d-good-t" x="356" y="84" text-anchor="middle">SYN · MSS = 1380</text>
<text class="d-l d-good-t" x="260" y="118" text-anchor="middle">de router herschrijft de MSS (1420 − 40)</text>
<path class="d-line" d="M446 168 L74 168" marker-end="url(#m-mss-clamping)"/>
<text class="d-l" x="260" y="156" text-anchor="middle">data: 1380 B payload + 40 B headers = 1420 B</text>
<text class="d-l d-good-t" x="260" y="190" text-anchor="middle">past door de tunnel: geen fragmentatie, geen ICMP nodig</text>
<rect class="d-box d-good" x="10" y="216" width="500" height="54" rx="8"/>
<text class="d-s" x="260.0" y="239.0" text-anchor="middle">Zo hoeft PMTUD niet meer te werken</text>
<text class="d-l" x="260.0" y="254.0" text-anchor="middle">de server houdt zich aan de MSS uit de SYN van de client</text>
</svg>
