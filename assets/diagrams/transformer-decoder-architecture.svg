<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" width="100%" height="100%" style="background:#0f1117;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-attn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-mlp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-res" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.02em">Transformer Decoder-Only Architectuur (Llama / GPT / Mistral)</text>
  <text x="40" y="68" fill="#94a3b8" font-size="13">Van tekst en PyTorch-tensors tot autoregressieve token-predictie</text>

  <!-- Outer Layer Container (Nx Block) -->
  <rect x="220" y="195" width="420" height="340" rx="16" fill="#1e293b" fill-opacity="0.45" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 6" />
  <rect x="555" y="207" width="70" height="24" rx="6" fill="#334155" />
  <text x="590" y="223" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">× N Lagen</text>

  <!-- Step 1: Input Tokens -->
  <g transform="translate(310, 620)">
    <rect x="0" y="0" width="240" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="120" y="22" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Input: "De kat zit" → [124, 8923, 412]</text>
  </g>
  <text x="565" y="643" fill="#64748b" font-size="11" font-family="monospace">shape: (B, T)</text>

  <!-- Arrow to Embedding -->
  <line x1="430" y1="620" x2="430" y2="590" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Embedding + RoPE -->
  <g transform="translate(290, 545)">
    <rect x="0" y="0" width="280" height="42" rx="8" fill="url(#grad-accent)" filter="url(#shadow)" />
    <text x="140" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">nn.Embedding(V, d) + RoPE</text>
    <text x="140" y="34" fill="#bfdbfe" font-size="10" text-anchor="middle">Token embeddings + rotatieposities</text>
  </g>
  <text x="585" y="570" fill="#64748b" font-size="11" font-family="monospace">shape: (B, T, d)</text>

  <!-- Arrow into Layer -->
  <line x1="430" y1="545" x2="430" y2="515" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- INSIDE TRANSFORMER LAYER -->
  
  <!-- Residual Branch 1 Line -->
  <path d="M 430 525 L 260 525 L 260 380 L 415 380" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-res)" />
  <text x="250" y="450" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" transform="rotate(-90 250 450)">Residual Connection (Add)</text>

  <!-- RMSNorm 1 -->
  <rect x="330" y="485" width="200" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="430" y="503" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">RMSNorm (Pre-LayerNorm)</text>

  <line x1="430" y1="485" x2="430" y2="465" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Attention Block -->
  <g transform="translate(300, 415)">
    <rect x="0" y="0" width="260" height="48" rx="10" fill="url(#grad-attn)" filter="url(#shadow)" />
    <text x="130" y="21" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Causal Self-Attention (GQA/MHA)</text>
    <text x="130" y="37" fill="#ddd6fe" font-size="10.5" text-anchor="middle">Q, K, V projecties + KV-Cache buffer</text>
  </g>

  <line x1="430" y1="415" x2="430" y2="395" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Add 1 (+) -->
  <circle cx="430" cy="380" r="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="430" y="385" fill="#3b82f6" font-size="16" font-weight="700" text-anchor="middle">+</text>

  <line x1="430" y1="366" x2="430" y2="345" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Residual Branch 2 Line -->
  <path d="M 430 355 L 260 355 L 260 230 L 415 230" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow-res)" />
  <text x="250" y="295" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle" transform="rotate(-90 250 295)">Residual Connection (Add)</text>

  <!-- RMSNorm 2 -->
  <rect x="330" y="320" width="200" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="430" y="338" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">RMSNorm</text>

  <line x1="430" y1="320" x2="430" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Feed-Forward / SwiGLU Block -->
  <g transform="translate(300, 250)">
    <rect x="0" y="0" width="260" height="48" rx="10" fill="url(#grad-mlp)" filter="url(#shadow)" />
    <text x="130" y="21" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Feed-Forward Network (SwiGLU)</text>
    <text x="130" y="37" fill="#a7f3d0" font-size="10.5" text-anchor="middle">Gate, Up &amp; Down Linear Projections</text>
  </g>

  <line x1="430" y1="250" x2="430" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Add 2 (+) -->
  <circle cx="430" cy="230" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="430" y="235" fill="#10b981" font-size="16" font-weight="700" text-anchor="middle">+</text>

  <!-- Arrow out of Layer -->
  <line x1="430" y1="216" x2="430" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Final RMSNorm -->
  <rect x="330" y="150" width="200" height="26" rx="6" fill="#334155" stroke="#475569" stroke-width="1" />
  <text x="430" y="167" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Final RMSNorm</text>

  <line x1="430" y1="150" x2="430" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- LM Head -->
  <g transform="translate(290, 95)">
    <rect x="0" y="0" width="280" height="40" rx="8" fill="url(#grad-head)" filter="url(#shadow)" />
    <text x="140" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">nn.Linear(d, V) — LM Head</text>
    <text x="140" y="33" fill="#fef3c7" font-size="10" text-anchor="middle">Logits over vocabulaire: W_U x</text>
  </g>
  <text x="585" y="120" fill="#64748b" font-size="11" font-family="monospace">shape: (B, T, V)</text>

  <!-- Arrow to Output -->
  <line x1="430" y1="95" x2="430" y2="78" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Softmax & Next Token -->
  <text x="430" y="70" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Softmax → Volgend Token Voorspelling (Greedy / Top-p)</text>

  <!-- Code/Equation Side Callout Box -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="165" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="14" y="24" fill="#38bdf8" font-size="11" font-weight="700">PyTorch Equivalent</text>
    <text x="14" y="50" fill="#94a3b8" font-size="10" font-family="monospace">x = tok_emb(ids)</text>
    <text x="14" y="72" fill="#94a3b8" font-size="10" font-family="monospace">for layer in layers:</text>
    <text x="24" y="94" fill="#94a3b8" font-size="10" font-family="monospace">h = norm1(x)</text>
    <text x="24" y="114" fill="#94a3b8" font-size="10" font-family="monospace">x = x + attn(h)</text>
    <text x="24" y="134" fill="#94a3b8" font-size="10" font-family="monospace">h = norm2(x)</text>
    <text x="24" y="154" fill="#94a3b8" font-size="10" font-family="monospace">x = x + mlp(h)</text>
    <text x="14" y="172" fill="#38bdf8" font-size="10" font-family="monospace">logits = lm_head(x)</text>
  </g>
</svg>
